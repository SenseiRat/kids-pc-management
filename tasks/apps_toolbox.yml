---
- name: Check list of toolboxes on device
  become: true
  become_user: "{{ parent_username }}"
  ansible.builtin.command:
    cmd: toolbox list
  register: toolbox_list
  changed_when: false

- name: Get parent user's UID
  become: true
  ansible.builtin.getent:
    database: passwd
    key: "{{ parent_username }}"

- name: Create admin toolbox on device
  become: true
  become_user: "{{ parent_username }}"
  ansible.builtin.command:
    cmd: toolbox create --container {{ toolbox_name }}
  when: "toolbox_name not in toolbox_list.stdout"
  changed_when: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[parent_username][1] }}"


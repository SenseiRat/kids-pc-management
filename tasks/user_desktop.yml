---
- name: Get child user uid
  ansible.builtin.command: "id -u {{ child_username }}"
  register: child_uid_result
  changed_when: false

- name: Manage Budgie desktop layout for child user
  become: true
  become_user: "{{ child_username }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ child_uid_result.stdout }}/bus"
    XDG_RUNTIME_DIR: "/run/user/{{ child_uid_result.stdout }}"
  notify: Restart budgie panel
  block:
    - name: Set Budgie panel properties
      community.general.dconf:
        key: "/com/solus-project/budgie-panel/panels/{{ '{' + item.0.uuid + '}' }}/{{ item.1.key }}"
        value: "{{ item.1.value }}"
        state: present
      loop: "{{ budgie_panels | subelements('settings') }}"
      loop_control:
        label: "{{ item.0.uuid }}/{{ item.1.key }}"

    - name: Register top-level panel UUID list
      community.general.dconf:
        key: "/com/solus-project/budgie-panel/panels"
        value: "{{ budgie_panels | map(attribute='uuid') | list }}"
        state: present

    - name: Set Budgie applet properties
      community.general.dconf:
        key: "/com/solus-project/budgie-panel/applets/{{ '{' + item.0.uuid + '}' }}/{{ item.1.key }}"
        value: "{{ item.1.value }}"
        state: present
      loop: "{{ budgie_applets | subelements('settings') }}"
      loop_control:
        label: "{{ item.0.uuid }}/{{ item.1.key }}"

    - name: Find Steam-generated desktop shortcuts
      become: true
      become_user: "{{ child_username }}"
      ansible.builtin.find:
        paths: "/home/{{ child_username }}/.var/app/com.valvesoftware.Steam/Desktop"
        patterns: "*.desktop"
      register: steam_desktop_files

    - name: Symlink Steam desktop shortcuts into applications dir
      become: true
      become_user: "{{ child_username }}"
      ansible.builtin.file:
        src: "{{ item.path }}"
        dest: "/home/{{ child_username }}/.local/share/applications/{{ item.path | basename }}"
        state: link
        force: true
      loop: "{{ steam_desktop_files.files }}"

    - name: Update pinned-launchers with discovered Steam shortcuts
      community.general.dconf:
        key: "/com/solus-project/budgie-panel/instance/icon-tasklist/{{ '{' + budgie_icon_tasklist_uuid + '}' }}/pinned-launchers"
        value: "{{ (dock_pinned_apps + (steam_desktop_files.files | map(attribute='path') | map('basename') | sort | list)) | to_json }}"
        state: present

- name: Remove system update-lock after updates are complete
  become: true
  ansible.builtin.systemd_service:
    name: update-lock.service
    state: stopped
  register: remove_update_lock
  failed_when:
    - remove_update_lock.failed
    - "'Could not find the requested service' not in remove_update_lock.msg"

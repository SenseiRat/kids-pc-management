# SPDX-License-Identifier: MIT-0
---
- name: Add flatpak remotes to the system installation
  community.general.flatpak_remote:
    name: flathub
    state: present
    method: system
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

- name: "Install flatpaks"
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    method: system
  loop: "{{ flatpak_apps }}"

- name: Get list of installed flatpaks on system
  ansible.builtin.command:
    cmd: /usr/bin/flatpak list --app --columns=application
  register: flatpak_list
  changed_when: false

- name: Uninstall applications that are not on the APL
  community.general.flatpak:
    name: "{{ item }}"
    state: absent
  when: flatpak_apps is not contains(item)
  loop: "{{ flatpak_list.stdout_lines }}"

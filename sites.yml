---
- name: Configure child's computer
  hosts: child-pc
  become: true
  tasks:
    - name: User Configuration
      ansible.builtin.import_tasks: tasks/config_user.yml
    - name: Network Configuration
      ansible.builtin.import_tasks: tasks/config_network.yml
    - name: Power Configuration
      ansible.builtin.import_tasks: tasks/config_power.yml
    - name: Security Configuration
      ansible.builtin.import_tasks: tasks/config_security.yml

    - name: OS tree
      ansible.builtin.import_tasks: tasks/apps_ostree.yml
    - name: Apply any pending reboot
      ansible.builtin.meta: flush_handlers
    - name: Idle Watcher
      ansible.builtin.import_tasks: tasks/config_idle_watcher.yml

    - name: Flatpaks
      ansible.builtin.import_tasks: tasks/apps_flatpak.yml
    - name: Toolbox
      ansible.builtin.import_tasks: tasks/apps_toolbox.yml
    - name: Updates
      ansible.builtin.import_tasks: tasks/apps_updates.yml

    - name: User Desktop Configuration
      ansible.builtin.import_tasks: tasks/user_desktop.yml
    - name: User App Restrictions
      ansible.builtin.import_tasks: tasks/user_restrictions.yml


  handlers:
    - name: Reboot device
      ansible.builtin.shell: |
        set -euo pipefail

        SESSION_ID=$(loginctl show-user "{{ child_username }}" -p Sessions --value 2>/dev/null | awk '{print $1}') || true

        is_idle_long_enough() {
            [[ -z "$SESSION_ID" ]] && return 0

            local idle_hint idle_since_usec idle_seconds
            idle_hint=$(loginctl show-session "$SESSION_ID" -p IdleHint --value)
            [[ "$idle_hint" == "yes" ]] || return 1

            idle_since_usec=$(loginctl show-session "$SESSION_ID" -p IdleSinceHint --value)
            [[ "$idle_since_usec" -gt 0 ]] || return 1

            idle_seconds=$(( $(date +%s) - idle_since_usec / 1000000 ))
            (( idle_seconds >= {{ reboot_idle_threshold_minutes * 60 }} ))
        }

        if is_idle_long_enough; then
            reboot
        else
            shutdown -r 01:30
        fi
      changed_when: true

    - name: Restart logind
      become: true
      ansible.builtin.systemd_service:
        name: systemd-logind.service
        state: restarted

    - name: Restart idle watcher
      become: true
      ansible.builtin.systemd_service:
        name: idle-watcher.service
        state: restarted

    - name: Restart budgie panel
      ansible.builtin.command: pkill -u {{ child_username }} budgie-panel
      register: pkill_budgie
      changed_when: pkill_budgie.rc == 0
      failed_when: pkill_budgie.rc not in [0, 1]
